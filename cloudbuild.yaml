substitutions:
  _SERVICE_NAME: allpath-web
  _REGION: us-central1
  _IMAGE_TAG: latest
  _FIRESTORE_DATABASE_ID: default
  _OPENROUTER_SITE_URL: https://all-path.com
  _OPENROUTER_APP_NAME: AllPath
  _OPENROUTER_API_KEY_SECRET: OPENROUTER_API_KEY
  _TRIAL_COOKIE_SECRET_NAME: TRIAL_COOKIE_SECRET
  _TRIAL_ENCRYPTION_SECRET_NAME: TRIAL_ENCRYPTION_SECRET

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_IMAGE_TAG}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_IMAGE_TAG}

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_IMAGE_TAG}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --set-env-vars
      - NODE_ENV=production,FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID},OPENROUTER_SITE_URL=${_OPENROUTER_SITE_URL},OPENROUTER_APP_NAME=${_OPENROUTER_APP_NAME}
      - --set-secrets
      - OPENROUTER_API_KEY=${_OPENROUTER_API_KEY_SECRET}:latest,TRIAL_COOKIE_SECRET=${_TRIAL_COOKIE_SECRET_NAME}:latest,TRIAL_ENCRYPTION_SECRET=${_TRIAL_ENCRYPTION_SECRET_NAME}:latest

images:
  - gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_IMAGE_TAG}
